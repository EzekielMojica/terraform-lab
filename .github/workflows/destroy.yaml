name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete every resource Terraform created'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    # Skipped unless it runs against main and the confirmation matches.
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - run: terraform init -input=false
      - run: terraform destroy -input=false -auto-approve
